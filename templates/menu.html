<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Сайт</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
          <li class="nav-item">
            <span class="nav-link text-light">{{ user.username }}</span>
          </li>
          <li class="nav-item">
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
              {% csrf_token %}
              <button type="submit" class="nav-link btn btn-link text-light" style="display:inline; padding:0; border:none; background:none;">Вийти</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link text-light" href="{% url 'login' %}">Увійти</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
